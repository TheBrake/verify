[package]
name = "verify"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Ultra-fast local Git pre-push hook that blocks leaked secrets."
license = "MIT"

[dependencies]
globset = "=0.4.14"
regex = "=1.10.6"
serde = { version = "=1.0.197", features = ["derive"] }
toml = "=0.8.12"
# Pin so cargo does not pull edition2024-only transitive crates.
indexmap = { version = "=2.2.6", optional = false }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"