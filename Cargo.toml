[package]
name = "sverify"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Ultra-fast local Git pre-commit and pre-push hook that blocks leaked secrets."
license = "Apache-2.0"
repository = "https://github.com/TheBrake/verify"
keywords = ["git-hook", "security", "devsecops", "secrets-detection", "cli"]


[[bin]]
name = "verify"
path = "src/main.rs"

[dependencies]
globset = "=0.4.14"          # 0.4.20+ needs edition2024
regex = "~1.10.6"            # 1.10.x patches only
serde = { version = "~1.0.197", features = ["derive"] }
toml = "~0.8.12"             # 0.8.x; lockfile freezes the exact rev
indexmap = "~2.2.6"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"