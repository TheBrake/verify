name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VERIFY_DIST_TARGET: x86_64-unknown-linux-musl

jobs:
  test:
    name: cargo-test-locked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75.0"
      - name: cargo test --locked
        run: cargo test --locked

  dist-linux-musl:
    name: dist-x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75.0"
          targets: x86_64-unknown-linux-musl
      - name: musl-tools (linker for the rustc musl target)
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: package musl binary + sha256
        run: sh scripts/package-linux-musl.sh
      - name: assert statically linked
        run: |
          bin="dist/verify-x86_64-unknown-linux-musl"
          file "$bin"
          if ldd "$bin" >/tmp/ldd.out 2>&1; then
            echo "expected a static binary; ldd succeeded:" >&2
            cat /tmp/ldd.out >&2
            exit 1
          fi
          grep -qi "statically linked" <<<"$(file "$bin")"
      - uses: actions/upload-artifact@v4
        with:
          name: verify-x86_64-unknown-linux-musl
          path: |
            dist/verify-x86_64-unknown-linux-musl
            dist/verify-x86_64-unknown-linux-musl.sha256

  dist-macos:
    name: dist-aarch64-apple-darwin
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75.0"
          targets: aarch64-apple-darwin
      - name: package darwin binary + sha256
        run: |
          set -eu
          target=aarch64-apple-darwin
          cargo build --locked --release --target "$target"
          mkdir -p dist
          src="target/${target}/release/verify"
          test -f "$src"
          cp "$src" "dist/verify-${target}"
          (cd dist && shasum -a 256 "verify-${target}" > "verify-${target}.sha256")
          file "dist/verify-${target}"
      - uses: actions/upload-artifact@v4
        with:
          name: verify-aarch64-apple-darwin
          path: |
            dist/verify-aarch64-apple-darwin
            dist/verify-aarch64-apple-darwin.sha256

  release:
    name: draft-github-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, dist-linux-musl, dist-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: list artifacts
        run: ls -l dist && echo "--- checksums ---" && cat dist/*.sha256
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/verify-x86_64-unknown-linux-musl
            dist/verify-x86_64-unknown-linux-musl.sha256
            dist/verify-aarch64-apple-darwin
            dist/verify-aarch64-apple-darwin.sha256
          body: |
            Binario portable de Verify. No hace falta Rust ni Cargo para usarlo.

            Linux (x86_64, estático / musl):

            ```bash
            # sustituye TAG por esta etiqueta, p. ej. v1.0.0
            curl -sSL -o verify "https://github.com/TheBrake/verify/releases/download/${{ github.ref_name }}/verify-x86_64-unknown-linux-musl"
            sha256sum -c verify-x86_64-unknown-linux-musl.sha256
            install -m 755 verify ~/.local/bin/verify
            cd /ruta/al/repo
            verify install
            ```

            macOS: `verify-aarch64-apple-darwin`.
            
            Este Release *es* la distribución de V1.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}